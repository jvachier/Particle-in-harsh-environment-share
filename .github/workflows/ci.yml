name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build-test-pragma:
    name: Build and Test Pragma SIMD (CPU)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-13 libomp-dev make

    - name: Build Pragma SIMD implementation
      run: |
        cd implementation_pragma
        make clean
        make

    - name: Verify binary created
      run: |
        ls -lh implementation_pragma/main_pragma.out
        echo "✓ Pragma SIMD build completed successfully!"

    - name: Run Pragma SIMD tests
      run: |
        cd tests
        make clean
        make test:correctness:pragma || echo "Tests require baseline data"
